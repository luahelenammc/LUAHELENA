<script>
(()=>{
 'use strict';
 const base='https://www.luahelena.com.br/papers/';
 const works=[
 {id:'soberania',title:'Soberania Cognitiva Brasileira',coverTitle:'Soberania Cognitiva Brasileira',subtitle:'Oito capacidades para governança pública da inteligência artificial',description:'Uma matriz de oito capacidades para avaliar se o Brasil mantém poder de decisão sobre infraestrutura, modelos, dados e memória que sustentam os sistemas de IA.',category:['publicacoes','ia'],href:'soberaniacognitiva.html',pdf:'soberaniacognitiva.pdf',kind:'Paper',date:'2026-10-30',eyebrow:'PAPERS · LUA HELENA',className:'soberania'},
 {id:'tempo',title:'Jornada 12×36 e direito ao tempo',coverTitle:'12×36',subtitle:'O direito ao tempo depois da reforma da jornada',description:'Análise das novas regras constitucionais da jornada de trabalho e das condições para que a escala 12×36 preserve tempo de descanso real.',category:['publicacoes','trabalho'],href:'12x36.html',pdf:'assets/nota-tecnica-12x36-direito-ao-tempo.pdf',kind:'Paper',date:'2026-11-03',eyebrow:'TRABALHO · DIREITOS',className:'tempo'},
 {id:'vida',title:'IA pela Vida',coverTitle:'IA pela Vida',subtitle:'Inteligência pública para proteger clima, florestas e animais',description:'Proposta de sistema público de inteligência socioambiental para clima, florestas, biodiversidade, fiscalização e proteção animal.',category:['publicacoes','ia'],href:'iapelavida.html',kind:'Paper',eyebrow:'INTELIGÊNCIA SOCIOAMBIENTAL',className:'vida'},
 {id:'direito',title:'Direito sem caminho não é acesso',coverTitle:'Direito sem caminho não é acesso',subtitle:'IA pública, saúde trans e caminhos reais de acesso ao SUS',description:'Proposta de navegação pública de direitos, serviços e fluxos de regulação, construída em torno da experiência concreta de acesso à saúde trans.',category:['publicacoes','ia'],href:'direitosemcaminho.html',kind:'Paper',eyebrow:'SAÚDE · DIREITOS',className:'direito'},
 {id:'resumo',title:'Soberania Cognitiva · Resumo executivo',coverTitle:'Soberania Cognitiva: resumo',subtitle:'Síntese da matriz de oito capacidades',description:'Resumo executivo da matriz de soberania cognitiva e de suas condições para adoção responsável.',category:['documentos'],href:'soberaniacognitiva-resumo.html',kind:'Resumo executivo',eyebrow:'SÍNTESE · LUA HELENA',className:'brief'},
 {id:'nota',title:'Nota técnica · 12×36',coverTitle:'Nota técnica 12×36',subtitle:'Direito ao tempo e jornada',description:'Versão técnica em PDF do estudo sobre jornada 12×36.',category:['documentos'],href:'assets/nota-tecnica-12x36-direito-ao-tempo.pdf',kind:'PDF',eyebrow:'DOCUMENTO · PDF',className:'pdf'},
 {id:'caderno',title:'Caderno de leitura · 12×36',coverTitle:'Caderno 12×36',subtitle:'Booklet de leitura, versão 3',description:'Caderno de leitura do paper sobre 12×36, em PDF.',category:['documentos'],href:'assets/12x36-direito-ao-tempo-booklet-v3-reader.pdf',kind:'PDF',eyebrow:'BOOKLET · PDF',className:'pdf'}
 ];
 const collections=[{id:'publicacoes',label:'Todos os papers'},{id:'ia',label:'IA e políticas públicas'},{id:'trabalho',label:'Trabalho e direitos'},{id:'documentos',label:'PDFs e resumos'}];
 let collection='publicacoes',view='grid',order='default',query='',lastFocus=null;
 const $=s=>document.querySelector(s);const clock=$('#clock'),menu=$('#collectionsMenu'),cb=$('#collectionsButton'),container=$('#bookshelf'),count=$('#resultCount');
 const time=()=>{const d=new Date(); clock.textContent=d.toLocaleTimeString('pt-BR',{hour:'numeric',minute:'2-digit'})};time();setInterval(time,60000);
 const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 const originalIds=works.map(w=>w.id),orderKey='lua-papers-shelf-order-v2';
 let savedIds=[];
 try{const stored=JSON.parse(localStorage.getItem(orderKey)||'[]');if(Array.isArray(stored))savedIds=stored.filter(id=>originalIds.includes(id))}catch(err){}
 let manualIds=[...new Set([...savedIds,...originalIds])],lastRect=null,opening=false,animationNumber=0,drag=null,suppressClick=false;
 function saveOrder(){try{localStorage.setItem(orderKey,JSON.stringify(manualIds))}catch(err){}}
 function isCustomized(){return manualIds.some((id,i)=>id!==originalIds[i])}
 function filtered(){let a=works.filter(x=>x.category.includes(collection));if(query){const q=query.toLocaleLowerCase('pt-BR');a=a.filter(x=>`${x.title} ${x.subtitle} ${x.description}`.toLocaleLowerCase('pt-BR').includes(q))}if(order==='az')a.sort((a,b)=>a.title.localeCompare(b.title,'pt-BR'));else a.sort((a,b)=>manualIds.indexOf(a.id)-manualIds.indexOf(b.id));return a}
 function announce(msg){$('#reorderStatus').textContent=msg}
 function moveWork(a,b){if(a===b||!manualIds.includes(a)||!manualIds.includes(b))return;manualIds.splice(manualIds.indexOf(a),1);manualIds.splice(manualIds.indexOf(b),0,a);saveOrder();render();announce('Livro reposicionado. Ordem salva neste navegador.')}
 function cover(w){let decoration=w.id==='soberania'?'<span class="orbit"></span>':w.id==='tempo'?'<span class="tempo-frame" aria-hidden="true"></span><span class="tempo-ornament" aria-hidden="true"></span>':w.id==='vida'?'<span class="leaf"></span>':w.id==='direito'?'<span class="route"></span>':w.id==='nota'||w.id==='caderno'?'<span class="pdf-rule"></span>':'';return w.id==='tempo'?`<span class="cover cover--tempo">${decoration}<span class="cover__content tempo-content"><span class="tempo-kicker">CADERNO DE DIREITOS SOCIAIS</span><span class="tempo-emblem" aria-hidden="true"><span class="tempo-emblem-ring"><span>✦</span></span></span><span class="tempo-topic">JORNADA DE TRABALHO</span><span class="tempo-figure">12<span>×</span>36</span><span class="tempo-caption">DIREITO AO TEMPO</span><span class="tempo-footer">LUA HELENA · 2026<small>PUBLICAÇÃO INDEPENDENTE</small></span></span></span>`:`<span class="cover cover--${w.className}">${decoration}<span class="cover__content"><span class="cover__eyebrow">${escapeHTML(w.eyebrow)}</span><span class="cover__title">${escapeHTML(w.coverTitle)}</span><span class="cover__subtitle">${escapeHTML(w.subtitle)}</span><span class="cover__author">LUA HELENA</span></span></span>`}
 function render(){const a=filtered();$('#resetOrder').hidden=!isCustomized();$('#dragHint').hidden=view!=='grid'||order==='az';count.textContent=`${a.length} ${a.length===1?'volume':'volumes'}`;container.className=view==='list'?'listview':'shelves';if(!a.length){container.innerHTML='<p class="empty-state">Nenhum volume encontrado nesta coleção.</p>';return}
 if(view==='list'){container.innerHTML=a.map(w=>`<button type="button" class="listitem" data-id="${w.id}"><span class="minicover ${w.className}"></span><span><strong>${escapeHTML(w.title)}</strong><small>${escapeHTML(w.subtitle)}</small></span><span class="chevron" aria-hidden="true">›</span></button>`).join('');return}
 const mobile=matchMedia('(max-width:760px)').matches; const cols=mobile?2:4;const rows=Math.max(3,Math.ceil(a.length/cols));container.innerHTML=Array.from({length:rows},(_,i)=>{const row=a.slice(i*cols,(i+1)*cols);return `<section class="shelf ${row.length?'':'empty'}" aria-label="Prateleira ${i+1}"><div class="shelf-inner">${row.map(w=>`<button type="button" class="volume" data-id="${w.id}" aria-label="Abrir ${escapeHTML(w.title)}" title="Arraste para reorganizar · Alt + setas">${cover(w)}<span class="bookname">${escapeHTML(w.title)}</span></button>`).join('')}</div></section>`}).join('')}
 function renderMenu(){ $('#collectionOptions').innerHTML=collections.map(x=>`<button type="button" data-collection="${x.id}" aria-current="${x.id===collection}">${escapeHTML(x.label)} ${x.id===collection?'<span class="checkmark">✓</span>':''}</button>`).join('')}
 function toggleMenu(open){menu.classList.toggle('open',open);cb.setAttribute('aria-expanded',String(open));if(open)renderMenu()}
 const noMotion=matchMedia('(prefers-reduced-motion: reduce)');
 function shape(t){
  // Closed Bézier-like funnel: 18 samples on each side, broad shoulders and gently concave sides.
  const top=.13+.87*Math.pow(t,.72),bottom=.055+.945*Math.pow(t,1.8),n=18;
  const left=[],right=[];
  for(let i=0;i<=n;i++){
   const y=i/n,shoulder=Math.pow(1-y,1.45),w=bottom+(top-bottom)*shoulder;
   const sway=(1-t)*.095*Math.sin(Math.PI*y)*(y-.18);
   left.push(`${(50-50*w+sway*100).toFixed(2)}% ${(y*100).toFixed(2)}%`);
   right.unshift(`${(50+50*w+sway*100).toFixed(2)}% ${(y*100).toFixed(2)}%`);
  }
  return `polygon(${left.concat(right).join(',')})`;
 }
 function curve(v){return 1-Math.pow(1-v,3)}
 function playGenie(reverse=false){
  const el=$('.dialog'),origin=lastRect,token=++animationNumber;
  if(noMotion.matches||!origin)return Promise.resolve();
  el.style.transform='none';el.style.clipPath='none';
  const target=el.getBoundingClientRect(),dx=origin.left+origin.width/2-target.left-target.width/2;
  const dy=origin.top+origin.height/2-target.top-target.height/2;
  const duration=reverse?610:830,start=performance.now();
  return new Promise(resolve=>{
   function frame(now){if(token!==animationNumber){resolve();return}
    const u=Math.min(1,(now-start)/duration),p=reverse?1-curve(u):curve(u);
    const travel=1-p,scaleX=.31+.69*p,scaleY=.16+.84*p;
    el.style.transform=`perspective(1300px) translate3d(${(dx*travel).toFixed(1)}px,${(dy*travel).toFixed(1)}px,0) scale(${scaleX.toFixed(4)},${scaleY.toFixed(4)}) rotateY(${(-13*travel).toFixed(2)}deg)`;
    el.style.clipPath=shape(p);el.style.opacity=String(Math.min(1,Math.max(.07,p*2.4)));
    if(u<1)requestAnimationFrame(frame);else{el.style.transform='';el.style.clipPath='';el.style.opacity='';resolve()}
   }
   requestAnimationFrame(frame);
  });
 }
 function flipCover(source){
  if(!source||noMotion.matches)return;
  const coverEl=source.querySelector('.cover');if(!coverEl)return;
  const rect=coverEl.getBoundingClientRect(),ghost=document.createElement('div');
  ghost.className='flight-book';ghost.style.cssText=`left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px`;
  ghost.append(coverEl.cloneNode(true));document.body.append(ghost);
  const modal=$('.dialog').getBoundingClientRect();const toX=(modal.left+modal.width*.12)-(rect.left+rect.width*.5),toY=(modal.top+modal.height*.42)-(rect.top+rect.height*.5);
  ghost.animate([{transform:'translate3d(0,0,0) rotateY(0deg) scale(1)',opacity:1,offset:0},{transform:`translate3d(${toX*.62}px,${toY*.62}px,0) rotateY(-95deg) scale(1.28)`,opacity:.93,offset:.6},{transform:`translate3d(${toX}px,${toY}px,0) rotateY(-173deg) scale(1.55)`,opacity:0,offset:1}],{duration:750,easing:'cubic-bezier(.21,.77,.15,1)',fill:'forwards'}).finished.catch(()=>{}).then(()=>ghost.remove());
 }
 function openWork(id,source){
  const w=works.find(w=>w.id===id);if(!w||opening)return;
  opening=true;lastFocus=document.activeElement;
  const origin=source?.querySelector('.cover')||source;lastRect=origin?.getBoundingClientRect()||null;
  $('#dialogKind').textContent=w.kind;$('#dialogTitle').textContent=w.title;
  $('#dialogSubtitle').textContent=w.subtitle;$('#dialogDescription').textContent=w.description;
  const href=base+w.href;let actions=`<a href="${href}" rel="noopener">${w.kind==='PDF'?'Abrir PDF':'Ler publicação'} ↗</a>`;
  if(w.pdf)actions+=`<a class="secondary" href="${base+w.pdf}" target="_blank" rel="noopener">Consultar PDF ↗</a>`;
  actions+='<button type="button" class="secondary" id="dialogBack">Voltar à estante</button>';
  $('#dialogActions').innerHTML=actions;
  const backdrop=$('#dialogBackdrop');backdrop.classList.add('open');backdrop.setAttribute('aria-hidden','false');document.body.classList.add('modal-open');
  flipCover(source);$('#dialogClose').focus({preventScroll:true});
  playGenie(false).then(()=>{opening=false});
 }
 function closeDialog(){
  const el=$('#dialogBackdrop');if(!el.classList.contains('open')||opening)return;
  opening=true;playGenie(true).then(()=>{el.classList.remove('open');el.setAttribute('aria-hidden','true');document.body.classList.remove('modal-open');opening=false;lastFocus?.focus({preventScroll:true})});
 }
 cb.addEventListener('click',()=>toggleMenu(!menu.classList.contains('open')));$('#collectionOptions').addEventListener('click',e=>{let item=e.target.closest('[data-collection]');if(!item)return;collection=item.dataset.collection;toggleMenu(false);render()});document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!cb.contains(e.target))toggleMenu(false)});
 $('#searchInput').addEventListener('input',e=>{query=e.target.value.trim();render()});
 $('#gridButton').addEventListener('click',()=>setView('grid'));$('#listButton').addEventListener('click',()=>setView('list'));function setView(v){view=v;$('#gridButton').classList.toggle('active',v==='grid');$('#listButton').classList.toggle('active',v==='list');$('#gridButton').setAttribute('aria-pressed',v==='grid');$('#listButton').setAttribute('aria-pressed',v==='list');render()}
 $('#orderButton').addEventListener('click',e=>{order=order==='default'?'az':'default';e.target.textContent=order==='az'?'A–Z ✓':'Ordenar';render()});container.addEventListener('click',e=>{if(suppressClick){suppressClick=false;e.preventDefault();return}const b=e.target.closest('[data-id]');if(b)openWork(b.dataset.id,b)});$('#dialogClose').addEventListener('click',closeDialog);$('#dialogBackdrop').addEventListener('click',e=>{if(e.target.id==='dialogBackdrop'||e.target.id==='dialogBack')closeDialog()});$('#dialogActions').addEventListener('click',e=>{if(e.target.id==='dialogBack')closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();toggleMenu(false)}if(e.key==='Tab'&&$('#dialogBackdrop').classList.contains('open')){const focusable=[...$('#dialogBackdrop').querySelectorAll('button,a[href]')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});let currentMobile=matchMedia('(max-width:760px)').matches;window.addEventListener('resize',()=>{const next=matchMedia('(max-width:760px)').matches;if(next!==currentMobile){currentMobile=next;render()}});

 $('#resetOrder').addEventListener('click',()=>{manualIds=originalIds.slice();saveOrder();order='default';$('#orderButton').textContent='Ordenar';render();announce('Ordem original restaurada.')});
 // Pointer-based rearrangement works with mouse, pen and long-press on touchscreens.
 function clearDrag(){if(!drag)return;clearTimeout(drag.timer);drag.el?.classList.remove('is-being-dragged');drag.ghost?.remove();container.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));document.body.classList.remove('is-dragging');drag=null}
 container.addEventListener('pointerdown',e=>{
  if(view!=='grid'||order==='az'||e.button!==0||opening)return;
  const el=e.target.closest('.volume[data-id]');if(!el)return;
  const start={id:el.dataset.id,el,pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,offsetX:0,offsetY:0,active:false,armed:e.pointerType!=='touch',ghost:null,target:null,timer:null};
  const rect=el.getBoundingClientRect();start.offsetX=e.clientX-rect.left;start.offsetY=e.clientY-rect.top;
  if(!start.armed)start.timer=setTimeout(()=>{if(drag===start)start.armed=true},330);
  drag=start;
 });
 window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pointerId)return;
  const d=drag,dist=Math.hypot(e.clientX-d.startX,e.clientY-d.startY);
  if(!d.active){if(dist<10)return;if(!d.armed){clearDrag();return}
   d.active=true;suppressClick=true;
   d.ghost=d.el.cloneNode(true);d.ghost.classList.add('drag-ghost');
   const r=d.el.getBoundingClientRect();d.ghost.style.width=r.width+'px';d.ghost.style.height=r.height+'px';
   document.body.append(d.ghost);d.el.classList.add('is-being-dragged');document.body.classList.add('is-dragging');
  }
  e.preventDefault();d.ghost.style.left=(e.clientX-d.offsetX)+'px';d.ghost.style.top=(e.clientY-d.offsetY)+'px';
  const candidate=document.elementFromPoint(e.clientX,e.clientY)?.closest('.volume[data-id]');
  container.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));
  d.target=candidate&&candidate!==d.el?candidate:null;
  if(d.target)d.target.classList.add('drop-target');
 },{passive:false});
 window.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.pointerId)return;const {active,id,target}=drag;
  clearDrag();if(active){suppressClick=true;if(target){moveWork(id,target.dataset.id)}setTimeout(()=>{suppressClick=false},300)}
 });
 window.addEventListener('pointercancel',clearDrag);
 // Keyboard users can reorder a focused book with Alt+left/right.
 container.addEventListener('keydown',e=>{
  if(view!=='grid'||order==='az'||!e.altKey||!['ArrowLeft','ArrowRight'].includes(e.key))return;
  const el=e.target.closest('.volume[data-id]');if(!el)return;
  const ids=filtered().map(w=>w.id),i=ids.indexOf(el.dataset.id),j=i+(e.key==='ArrowLeft'?-1:1);
  if(i<0||j<0||j>=ids.length)return;
  e.preventDefault();const from=ids[i],to=ids[j];
  if(e.key==='ArrowRight'){manualIds.splice(manualIds.indexOf(from),1);manualIds.splice(manualIds.indexOf(to)+1,0,from);saveOrder();render();}
  else moveWork(from,to);
  container.querySelector(`[data-id="${from}"]`)?.focus({preventScroll:true});
  announce('Posição do livro atualizada.');
 });
 renderMenu();render();
})();
</script>
