 ];
 const collections=[{id:'publicacoes',label:'Todos os papers'},{id:'ia',label:'IA e políticas públicas'},{id:'trabalho',label:'Trabalho e direitos'},{id:'documentos',label:'PDFs e resumos'}];
 let collection='publicacoes',view='grid',order='default',query='',lastFocus=null;
 const $=s=>document.querySelector(s);const clock=$('#clock'),menu=$('#collectionsMenu'),cb=$('#collectionsButton'),container=$('#bookshelf'),count=$('#resultCount');
 const time=()=>{const d=new Date(); clock.textContent=d.toLocaleTimeString('pt-BR',{hour:'numeric',minute:'2-digit'})};time();setInterval(time,60000);
 const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 function filtered(){let a=works.filter(x=>x.category.includes(collection));if(query){const q=query.toLocaleLowerCase('pt-BR');a=a.filter(x=>`${x.title} ${x.subtitle} ${x.description}`.toLocaleLowerCase('pt-BR').includes(q))}if(order==='az')a.sort((a,b)=>a.title.localeCompare(b.title,'pt-BR'));return a}
 function cover(w){let decoration=w.id==='soberania'?'<span class="orbit"></span>':w.id==='tempo'?'<span class="stripes"></span><span class="clockface"></span>':w.id==='vida'?'<span class="leaf"></span>':w.id==='direito'?'<span class="route"></span>':w.id==='nota'||w.id==='caderno'?'<span class="pdf-rule"></span>':'';return `<span class="cover cover--${w.className}">${decoration}<span class="cover__content"><span class="cover__eyebrow">${escapeHTML(w.eyebrow)}</span><span class="cover__title">${escapeHTML(w.coverTitle)}</span><span class="cover__subtitle">${escapeHTML(w.subtitle)}</span><span class="cover__author">LUA HELENA</span></span></span>`}
 function render(){const a=filtered(); count.textContent=`${a.length} ${a.length===1?'volume':'volumes'}`;container.className=view==='list'?'listview':'shelves';if(!a.length){container.innerHTML='<p class="empty-state">Nenhum volume encontrado nesta coleção.</p>';return}
 if(view==='list'){container.innerHTML=a.map(w=>`<button type="button" class="listitem" data-id="${w.id}"><span class="minicover ${w.className}"></span><span><strong>${escapeHTML(w.title)}</strong><small>${escapeHTML(w.subtitle)}</small></span><span class="chevron" aria-hidden="true">›</span></button>`).join('');return}
 const mobile=matchMedia('(max-width:760px)').matches; const cols=mobile?2:4;const rows=Math.max(3,Math.ceil(a.length/cols));container.innerHTML=Array.from({length:rows},(_,i)=>{const row=a.slice(i*cols,(i+1)*cols);return `<section class="shelf ${row.length?'':'empty'}" aria-label="Prateleira ${i+1}"><div class="shelf-inner">${row.map(w=>`<button type="button" class="volume" data-id="${w.id}" aria-label="Abrir ${escapeHTML(w.title)}">${cover(w)}<span class="bookname">${escapeHTML(w.title)}</span></button>`).join('')}</div></section>`}).join('')}
 function renderMenu(){ $('#collectionOptions').innerHTML=collections.map(x=>`<button type="button" data-collection="${x.id}" aria-current="${x.id===collection}">${escapeHTML(x.label)} ${x.id===collection?'<span class="checkmark">✓</span>':''}</button>`).join('')}
 function toggleMenu(open){menu.classList.toggle('open',open);cb.setAttribute('aria-expanded',String(open));if(open)renderMenu()}
 function openWork(id){const w=works.find(w=>w.id===id);if(!w)return;lastFocus=document.activeElement;$('#dialogKind').textContent=w.kind;$('#dialogTitle').textContent=w.title;$('#dialogSubtitle').textContent=w.subtitle;$('#dialogDescription').textContent=w.description;const href=base+w.href;let actions=`<a href="${href}" rel="noopener">${w.kind==='PDF'?'Abrir PDF':'Ler publicação'} ↗</a>`;if(w.pdf)actions+=`<a class="secondary" href="${base+w.pdf}" target="_blank" rel="noopener">Consultar PDF ↗</a>`;actions+='<button type="button" class="secondary" id="dialogBack">Voltar à estante</button>';$('#dialogActions').innerHTML=actions;$('#dialogBackdrop').classList.add('open');$('#dialogBackdrop').setAttribute('aria-hidden','false');$('#dialogClose').focus()}
 function closeDialog(){const el=$('#dialogBackdrop');el.classList.remove('open');el.setAttribute('aria-hidden','true');lastFocus?.focus()}
 cb.addEventListener('click',()=>toggleMenu(!menu.classList.contains('open')));$('#collectionOptions').addEventListener('click',e=>{let item=e.target.closest('[data-collection]');if(!item)return;collection=item.dataset.collection;toggleMenu(false);render()});document.addEventListener('click',e=>{if(!menu.contains(e.target)&&!cb.contains(e.target))toggleMenu(false)});
 $('#searchInput').addEventListener('input',e=>{query=e.target.value.trim();render()});
 $('#gridButton').addEventListener('click',()=>setView('grid'));$('#listButton').addEventListener('click',()=>setView('list'));function setView(v){view=v;$('#gridButton').classList.toggle('active',v==='grid');$('#listButton').classList.toggle('active',v==='list');$('#gridButton').setAttribute('aria-pressed',v==='grid');$('#listButton').setAttribute('aria-pressed',v==='list');render()}
 $('#orderButton').addEventListener('click',e=>{order=order==='default'?'az':'default';e.target.textContent=order==='az'?'A–Z ✓':'Ordenar';render()});container.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openWork(b.dataset.id)});$('#dialogClose').addEventListener('click',closeDialog);$('#dialogBackdrop').addEventListener('click',e=>{if(e.target.id==='dialogBackdrop'||e.target.id==='dialogBack')closeDialog()});$('#dialogActions').addEventListener('click',e=>{if(e.target.id==='dialogBack')closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();toggleMenu(false)}if(e.key==='Tab'&&$('#dialogBackdrop').classList.contains('open')){const focusable=[...$('#dialogBackdrop').querySelectorAll('button,a[href]')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});let currentMobile=matchMedia('(max-width:760px)').matches;window.addEventListener('resize',()=>{const next=matchMedia('(max-width:760px)').matches;if(next!==currentMobile){currentMobile=next;render()}});
 renderMenu();render();
})();
</script>
