name: Moonverse C1 Apply Bridge

on:
  pull_request:
    branches: [main]
    types: [reopened, synchronize]
    paths:
      - 'moonverse-src/**'
      - '.github/workflows/moonverse-review.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/moonverse-v2-c1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply readable C1 payload
        run: python3 moonverse-src/scripts/apply-c1.py

      - name: Build, validate and test
        run: |
          npm --prefix moonverse-src run build
          npm --prefix moonverse-src run validate
          npm --prefix moonverse-src run test
          git diff --check

      - name: Commit bounded delivery and restore canonical review
        run: |
          rm -f .moonverse-c1-payload.json
          rm -f moonverse-src/scripts/apply-c1.py
          rm -f .github/workflows/moonverse-v2-c1-apply.yml
          git show origin/main:.github/workflows/moonverse-review.yml > .github/workflows/moonverse-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Moonverse V2 editorial batch C1'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
