name: Sync Preflight V2 portable

on:
  push:
    branches: [sync-preflight-v2-portable-20260907]
    paths:
      - ".github/workflows/sync-preflight-v2.yml"

permissions:
  contents: write

jobs:
  sync-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sync-preflight-v2-portable-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Mirror exact canonical Preflight bytes
        run: |
          mkdir -p moonsource/downloads
          curl -fsSL https://raw.githubusercontent.com/luahelenammc/Moon-Source/main/portables/preflight/PREFLIGHT_V2.md -o moonsource/downloads/PREFLIGHT_V2.md
          curl -fsSL https://raw.githubusercontent.com/luahelenammc/Moon-Source/main/registry/public-portables.json -o /tmp/public-portables.json
          EXPECTED=$(python - <<'PY'
          import json
          data=json.load(open('/tmp/public-portables.json',encoding='utf-8'))
          print(next(p['canonical_sha256'] for p in data['portables'] if p['id']=='preflight'))
          PY
          )
          ACTUAL=$(sha256sum moonsource/downloads/PREFLIGHT_V2.md | cut -d' ' -f1)
          test "$EXPECTED" = "$ACTUAL"
          echo "Preflight mirror SHA-256 verified: $ACTUAL"
      - name: Reconcile Moon Source public facade
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('moonsource/index.html')
          t=p.read_text(encoding='utf-8')
          def rep(old,new,label,count=None):
              global t
              n=t.count(old)
              if n==0:
                  raise SystemExit(f'missing facade target: {label}')
              if count is not None and n!=count:
                  raise SystemExit(f'{label}: expected {count}, found {n}')
              t=t.replace(old,new)

          rep('https://github.com/luahelenammc/Moon-Source/blob/main/docs/PREFLIGHT.md','https://github.com/luahelenammc/Moon-Source/blob/main/portables/preflight/PREFLIGHT_V2.md','old Preflight links')
          rep('Preflight: moldar a tarefa antes da tarefa moldar a resposta.','Preflight V2: entender o humano antes de executar.','PT method title',2)
          rep('Antes da execução, o Preflight pode verificar intenção, autoridade, fatos ausentes, risco, destino e forma adequada — e então seguir, perguntar ou redirecionar.','A pessoa fala como pessoa; o Preflight reconstrói intenção, resultado, correções e limites. Governança mais pesada só entra quando a consequência realmente exige.','PT method copy',2)
          rep('Preflight: shape the task before the task shapes the response.','Preflight V2: understand the human before execution.','EN method title',1)
          rep('Before execution, Preflight can check intent, authority, missing facts, risk, destination, and proportionate form — then proceed, ask, or reroute.','People speak like people; Preflight reconstructs intent, outcome, corrections, and constraints. Heavier governance activates only when consequence actually requires it.','EN method copy',1)

          rep('<span class="tag">Preflight</span><h3 data-i18n="start.r2t">','<span class="tag">Preflight V2</span><h3 data-i18n="start.r2t">','start tag',1)
          rep('O pedido está vago, sensível ou indo para o lugar errado.','Quero que a IA entenda o que eu quis dizer sem eu escrever como prompt.','PT start title',2)
          rep('Modele a tarefa antes da execução e descubra se é hora de perguntar, rotear ou agir.','Reconstrua a intenção humana primeiro; pergunte só quando uma ambiguidade realmente mudar o resultado.','PT start copy',2)
          rep('The request is vague, sensitive, or heading to the wrong place.','I want AI to understand what I mean without writing like a prompt engineer.','EN start title',1)
          rep('Shape the task before execution and decide whether to ask, route, or act.','Reconstruct human intent first; ask only when an ambiguity would materially change the result.','EN start copy',1)

          pattern=r'<article class="component"><span class="tag">Preflight</span>.*?</article>'
          replacement='<article class="component"><span class="tag">Source Operations</span><h3 data-i18n="components.c1t">Operar fontes sem confundir leitura, transformação e mudança.</h3><p data-i18n="components.c1c">Retrieve, process, metabolize, promote, sucessão e readback.</p><a href="https://github.com/luahelenammc/Moon-Source/blob/main/docs/SOURCE_OPERATIONS.md" target="_blank" rel="noopener">GitHub ↗</a></article>'
          t,n=re.subn(pattern,replacement,t,count=1)
          if n!=1: raise SystemExit(f'component replacement expected 1, found {n}')
          rep('Moldar a tarefa antes de executar.','Operar fontes sem confundir leitura, transformação e mudança.','PT c1 title',1)
          rep('Intenção, autoridade, risco, fatos ausentes, destino e forma.','Retrieve, process, metabolize, promote, sucessão e readback.','PT c1 copy',1)
          rep('Shape the task before execution.','Operate sources without collapsing reading, transformation, and change.','EN c1 title',1)
          rep('Intent, authority, risk, missing facts, destination, and form.','Retrieve, process, metabolize, promote, succession, and readback.','EN c1 copy',1)
          rep('<time>2026-08-23</time><strong>Preflight</strong>','<time>2026-09-04</time><strong>Source Operations</strong>','update strip',1)

          rep('grid-template-columns:1.1fr repeat(3,.7fr)','grid-template-columns:1.1fr repeat(4,.7fr)','status grid',1)
          status_anchor='<div class="status-cell"><span class="status-label" data-i18n="status.registry">Registry público</span><span class="status-value" data-i18n="status.regval">9 componentes atuais · schema 1.1</span></div>'
          rep(status_anchor,status_anchor+'<div class="status-cell"><span class="status-label">Preflight</span><span class="status-value">2.0</span></div>','Preflight status',1)
          rep('<span class="status-label">Chat–Work</span><span class="status-value">4.0-public</span>','<span class="status-label">Chat–Work</span><span class="status-value">4.2-public</span>','Chat-Work status',1)
          rep('Os três portables têm versões próprias e são projeções da mesma arquitetura pública.','Os quatro portables têm versões próprias e são projeções da mesma arquitetura pública.','PT download count',2)
          rep('The three portables have their own versions and are projections of the same public architecture.','The four portables have their own versions and are projections of the same public architecture.','EN download count',1)
          t,n=re.subn(r'(<section class="section" id="downloads">.*?<div class=")grid grid-3(">)',r'\1grid grid-2\2',t,count=1)
          if n!=1: raise SystemExit('downloads grid conversion failed')
          setup_card='<article class="download"><span class="tag">Setup 3.0</span><h3 data-i18n="downloads.d1t">Context setup adaptativo</h3><p data-i18n="downloads.d1c">Para estruturar o menor contexto útil de uma pessoa ou projeto.</p><a href="downloads/MOON_SOURCE_SETUP.md" download data-i18n="downloads.get">Baixar .md ↓</a></article>'
          preflight_card='<article class="download"><span class="tag">Preflight 2.0</span><h3 data-i18n="downloads.d4t">Reconstrução de intenção humana</h3><p data-i18n="downloads.d4c">Para falar naturalmente e deixar a IA reconstruir a tarefa antes de executar.</p><a href="downloads/PREFLIGHT_V2.md" download data-i18n="downloads.get">Baixar .md ↓</a></article>'
          rep(setup_card,setup_card+preflight_card,'Preflight download card',1)

          rep('"downloads.d3c":"Para rotear por objeto, capacidade, esforço e orçamento no ChatGPT.",','"downloads.d3c":"Para rotear por objeto, capacidade, esforço e orçamento no ChatGPT.","downloads.d4t":"Reconstrução de intenção humana","downloads.d4c":"Para falar naturalmente e deixar a IA reconstruir a tarefa antes de executar.",','PT d4 keys',1)
          rep('"downloads.d3c":"Route by object, capability, effort, and budget in ChatGPT.",','"downloads.d3c":"Route by object, capability, effort, and budget in ChatGPT.","downloads.d4t":"Human intent reconstruction","downloads.d4c":"Speak naturally and let AI reconstruct the task before execution.",','EN d4 keys',1)

          if 'blob/main/docs/PREFLIGHT.md' in t: raise SystemExit('stale Preflight canonical link remains')
          if 'downloads/PREFLIGHT_V2.md' not in t: raise SystemExit('Preflight download is not exposed')
          if 'Source Operations' not in t: raise SystemExit('Source Operations missing from component grid')
          p.write_text(t,encoding='utf-8',newline='\n')
          PY
      - name: Verify facade and mirror
        run: |
          grep -q 'portables/preflight/PREFLIGHT_V2.md' moonsource/index.html
          grep -q 'downloads/PREFLIGHT_V2.md' moonsource/index.html
          grep -q 'Os quatro portables' moonsource/index.html
          grep -q 'The four portables' moonsource/index.html
          grep -q 'Source Operations' moonsource/index.html
      - name: Remove one-shot workflow and commit clean website state
        run: |
          rm .github/workflows/sync-preflight-v2.yml
          git config user.name "Lua H. Moon M. C."
          git config user.email "luahelenammc@gmail.com"
          git add -A
          git status --short
          git commit -m "Publish Preflight V2 portable mirror and facade"
          git push origin HEAD:sync-preflight-v2-portable-20260907
