name: Moonverse V5 Second Pass

on:
  push:
    branches:
      - feat/moonverse-v5-encyclopedic-corpus
    paths:
      - .github/workflows/moonverse-v5-second-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/moonverse-v5-encyclopedic-corpus
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply second-pass source mining
        run: node moonverse-src/scripts/_expand-v5-source-mining.mjs
      - name: Normalize Moonpedia group taxonomy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('moonverse-src/v4/build-v4.mjs')
          s = p.read_text()
          s = s.replace("['Memória & tecnologia',['maresia','sims','orkut-msn','infancia-digital','tecnologia-ia']]", "['Memória, lugares & tecnologia',['maresia','kairos','sims','orkut-msn','infancia-digital','tecnologia-ia']]")
          s = s.replace("['IA, arquivo & mundos autorais',['moon-source','moonwiki','moonverse','lunar-citadel','story-scanner','lithia','kairos']]", "['IA, arquivo & mundos autorais',['moon-source','moonwiki','moonverse','lunar-citadel','story-scanner','lithia']]")
          p.write_text(s)
          PY
      - name: Build and validate expanded corpus
        run: |
          npm --prefix moonverse-src run build
          npm --prefix moonverse-src run validate
          npm --prefix moonverse-src run test
      - name: Remove one-time machinery
        run: |
          rm -f moonverse-src/scripts/_expand-v5-source-mining.mjs
          rm -f .github/workflows/moonverse-v5-second-pass.yml
      - name: Commit expanded corpus
        run: |
          git config user.name "Moonverse Editorial Applicator"
          git config user.email "actions@users.noreply.github.com"
          git add -A moonverse-src moonverse .github/workflows/moonverse-v5-second-pass.yml
          git commit -m "Expand Moonpedia from the Sobre a Moon source corpus"
          git push origin HEAD:feat/moonverse-v5-encyclopedic-corpus
