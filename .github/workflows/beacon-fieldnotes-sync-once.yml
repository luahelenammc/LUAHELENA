name: Beacon Field Notes one-time derived build
on:
  push:
    branches:
      - beacon-fieldnotes-four-published-20261106
    paths:
      - ".github/workflows/beacon-fieldnotes-sync-once.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build canonical Beacon representations and indexes
        run: python3 beacon/tools/build_discovery.py --write
      - name: Validate complete Beacon and all Field Notes tests
        run: |
          python3 beacon/tools/build_discovery.py --check
          python3 -m unittest discover -s beacon/tools -p "test_fieldnotes.py" -v
      - name: Commit generated projections on this branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beacon
          if ! git diff --cached --quiet; then
            git commit -m "Beacon: synchronize Field Notes HTML, text, hashes, indexes and feed"
            git push origin HEAD:beacon-fieldnotes-four-published-20261106
          fi
