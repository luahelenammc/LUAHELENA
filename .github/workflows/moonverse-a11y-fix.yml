name: Moonverse Accessibility Fix

on:
  push:
    branches:
      - feat/moonverse-rebuild-v1
    paths:
      - '.github/workflows/moonverse-a11y-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/moonverse-rebuild-v1
          fetch-depth: 0

      - name: Apply audited accessibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('moonverse-src/src/styles/site.css'): [
                  ('--ink-faint: #8b8184;', '--ink-faint: #6b6164;'),
                  ('.wing-line-number, .path-line > span:first-child { color: var(--wing-accent, var(--plum));', '.wing-line-number, .path-line > span:first-child { color: var(--ink-soft);'),
              ],
              Path('moonverse-src/scripts/build.mjs'): [
                  ('role="img" aria-labelledby="atlas-figure-title atlas-figure-desc"', 'role="group" aria-labelledby="atlas-figure-title atlas-figure-desc"'),
              ],
              Path('moonverse-src/scripts/review.mjs'): [
                  ("colorScheme: 'dark'", "colorScheme: 'light'"),
              ],
          }

          for file_path, pairs in replacements.items():
              text = file_path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Missing expected source in {file_path}: {old}')
                  text = text.replace(old, new, 1)
              file_path.write_text(text, encoding='utf-8')
              print(f'updated {file_path}')
          PY

      - name: Build and verify
        run: |
          npm --prefix moonverse-src run build
          npm --prefix moonverse-src run validate
          npm --prefix moonverse-src run test

      - name: Commit audited fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add moonverse-src/src/styles/site.css moonverse-src/scripts/build.mjs moonverse-src/scripts/review.mjs moonverse
          git commit -m 'fix(moonverse): satisfy visual accessibility gates'
          git push
